<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Airloom · 温湿度</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18332d;background:#f4f6f1;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:32px 20px 50px}
    header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 5px}h2{font-size:16px;margin:0 0 14px}p{line-height:1.65;margin:6px 0}.muted,small{color:#63776f;font-size:13px}.connection{border-radius:30px;padding:8px 13px;background:#e0eee3;font-size:13px}.connection.error{background:#fce4db;color:#8b3020}
    .cards,.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.card,.panel{background:white;border:1px solid #dce5da;border-radius:16px;padding:24px}.value{font-size:48px;font-weight:600;letter-spacing:-2px;margin:10px 0}.unit{font-size:23px;font-weight:400;letter-spacing:0}.age{color:#63776f;font-size:13px;min-height:1.6em}.panel{margin-bottom:18px}.charts .panel{margin-bottom:0}canvas{display:block;width:100%;height:190px}.note{padding:0 3px 16px}.table-wrap{overflow:auto;max-height:400px}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #e6ece4}th{position:sticky;top:0;background:white;color:#63776f;font-weight:500}td:first-child{font-variant-numeric:tabular-nums}footer{font-size:12px;color:#63776f}.legend{margin-bottom:6px}.no-data{color:#63776f;padding:16px 0}.paging{display:flex;gap:10px;margin-top:18px}button{font:inherit;padding:9px 15px;border-radius:8px;border:1px solid #cddccc;background:#edf3eb;color:#244c3b;cursor:pointer}button:disabled{opacity:.45;cursor:default}
    @media(max-width:620px){main{padding:24px 14px}.cards{gap:10px}.card{padding:18px 14px}.value{font-size:36px}.unit{font-size:18px}.charts{grid-template-columns:1fr}.panel{padding:18px}header{align-items:flex-start}.connection{white-space:nowrap}h1{font-size:25px}}
  </style>
</head>
<body>
<main>
  <header><div><h1>Airloom</h1><p class="muted">NanoC6 · 温湿度と受信履歴</p></div><span id="connection" class="connection">接続中…</span></header>
  <section class="cards" aria-label="最新の温湿度">
    <article class="card"><h2>温度</h2><div class="value"><span id="temperature">—</span> <span class="unit">°C</span></div><div id="temperature-age" class="age">受信待ち</div></article>
    <article class="card"><h2>湿度</h2><div class="value"><span id="humidity">—</span> <span class="unit">%RH</span></div><div id="humidity-age" class="age">受信待ち</div></article>
  </section>
  <p id="sensor" class="muted note">センサーを確認しています。</p>
  <section class="charts" aria-label="温湿度の履歴グラフ">
    <article class="panel"><h2>温度の推移</h2><canvas id="temperature-chart" role="img" aria-label="温度の受信履歴。数値は下の履歴表で確認できます。"></canvas></article>
    <article class="panel"><h2>湿度の推移</h2><canvas id="humidity-chart" role="img" aria-label="湿度の受信履歴。数値は下の履歴表で確認できます。"></canvas></article>
  </section>
  <section class="panel"><h2>受信履歴</h2><p id="history-note" class="muted legend">履歴を読み込んでいます。</p><div class="table-wrap"><table><thead><tr><th>受信時刻 / 起動後の時間</th><th>報告</th><th>温度 °C</th><th>湿度 %RH</th></tr></thead><tbody id="history"></tbody></table></div><div class="paging"><button id="older" disabled>古い履歴</button><button id="newer" disabled>新しい履歴</button></div></section>
  <footer><p id="device">—</p><p>5秒ごとに更新。時刻未同期の記録は、起動ごとの経過時間で表示します。温度・湿度は別々のタイミングで報告されます。</p></footer>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const number = value => typeof value === 'number' && Number.isFinite(value);
const formatValue = value => number(value) ? value.toFixed(2) : '—';
let history = [];
let offset = 0, busy = false, timer;
const PAGE_SIZE = 32;
function elapsed(seconds) {
  if (!number(seconds)) return '不明';
  const value = Math.max(0, Math.floor(seconds));
  if (value < 60) return value + '秒';
  if (value < 3600) return Math.floor(value / 60) + '分' + value % 60 + '秒';
  return Math.floor(value / 3600) + '時間' + Math.floor(value % 3600 / 60) + '分';
}
function ageText(latest, key) {
  if (!number(latest[key])) return '未受信';
  const age = latest[key === 'temperature_c' ? 'temperature_age_seconds' : 'humidity_age_seconds'];
  if (number(age)) return '最終受信から ' + elapsed(age);
  return latest.from_previous_boot ? '以前の起動で受信 · 現在の鮮度は不明' : '受信からの経過時間は不明';
}
function renderStatus(status) {
  const latest = status.latest;
  byId('temperature').textContent = formatValue(latest && latest.temperature_c);
  byId('humidity').textContent = formatValue(latest && latest.humidity_percent);
  byId('temperature-age').textContent = latest ? ageText(latest, 'temperature_c') : '受信待ち';
  byId('humidity-age').textContent = latest ? ageText(latest, 'humidity_percent') : '受信待ち';
  byId('sensor').textContent = latest ? 'センサー ' + latest.sensor_id : 'ペアリング済みセンサーからの報告を待っています。';
  byId('device').textContent = '起動後 ' + elapsed(status.uptime_seconds) + ' · 保存 ' + status.history_count + ' / ' + status.history_capacity + '件 · ' + (status.time_synchronized ? '時刻同期済み' : '時刻未同期');
  byId('connection').textContent = status.storage_ok ? '接続済み' : '保存エラー';
  byId('connection').classList.toggle('error', !status.storage_ok);
}
function recordTime(record) {
  if (number(record.received_at)) return new Date(record.received_at * 1000).toLocaleString('ja-JP', {hour12: false});
  return '起動 ' + String(record.boot_id).slice(0, 8) + ' ＋' + elapsed(record.received_uptime_seconds);
}
function renderHistory(records, status) {
  const rows = document.createDocumentFragment();
  for (const record of records.slice().reverse()) {
    const tr = document.createElement('tr');
    const values = [recordTime(record), record.kind === 'temperature' ? '温度' : '湿度', formatValue(record.temperature_c), formatValue(record.humidity_percent)];
    for (const value of values) { const td = document.createElement('td'); td.textContent = value; tr.append(td); }
    rows.append(tr);
  }
  byId('history').replaceChildren(rows);
  byId('history-note').textContent = records.length ? '保存済み ' + status.history_count + '件 · 新しい順で ' + (offset + 1) + '〜' + (offset + records.length) + '件目。グラフの横軸は報告順です。' : 'まだ保存された温湿度の履歴はありません。';
  byId('older').disabled = offset + PAGE_SIZE >= status.history_count;
  byId('newer').disabled = offset === 0;
  drawCharts();
}
function drawChart(id, kind, key, color) {
  const canvas = byId(id), box = canvas.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(box.width * ratio); canvas.height = Math.round(box.height * ratio);
  const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio);
  const width = box.width, height = box.height;
  const points = history.filter(record => record.kind === kind && number(record[key]));
  ctx.font = '12px system-ui'; ctx.fillStyle = '#63776f';
  if (!points.length) { ctx.fillText('報告待ち', 14, height / 2); return; }
  const values = points.map(record => record[key]);
  let low = Math.min(...values), high = Math.max(...values);
  const padding = Math.max((high - low) * 0.15, 0.2); low -= padding; high += padding;
  const left = 46, right = width - 12, top = 12, bottom = height - 28;
  for (let i = 0; i < 3; i++) {
    const y = top + (bottom - top) * i / 2;
    ctx.strokeStyle = '#e6ece4'; ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
    ctx.fillStyle = '#63776f'; ctx.fillText((high - (high - low) * i / 2).toFixed(1), 2, y + 4);
  }
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  points.forEach((record, i) => {
    const x = points.length === 1 ? (left + right) / 2 : left + (right - left) * i / (points.length - 1);
    const y = bottom - (record[key] - low) / (high - low) * (bottom - top);
    if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  });
  ctx.stroke();
  if (points.length === 1) { ctx.beginPath(); ctx.arc((left + right) / 2, bottom - (values[0] - low) / (high - low) * (bottom - top), 3, 0, 2 * Math.PI); ctx.fill(); }
  ctx.fillStyle = '#63776f'; ctx.fillText('古い報告', left, height - 5); ctx.textAlign = 'right'; ctx.fillText('新しい報告', right, height - 5);
}
function drawCharts() { drawChart('temperature-chart', 'temperature', 'temperature_c', '#ad633e'); drawChart('humidity-chart', 'humidity', 'humidity_percent', '#357e84'); }
async function readJson(url) {
  const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 8000);
  try { const response = await fetch(url, {cache: 'no-store', signal: controller.signal}); if (!response.ok) throw new Error('HTTP ' + response.status); return await response.json(); }
  finally { clearTimeout(timer); }
}
async function refresh() {
  if (busy) return;
  busy = true;
  clearTimeout(timer);
  byId('older').disabled = true; byId('newer').disabled = true;
  try {
    const status = await readJson('/api/status');
    if (offset >= status.history_count) offset = Math.max(0, Math.floor((status.history_count - 1) / PAGE_SIZE) * PAGE_SIZE);
    history = await readJson('/api/history?limit=' + PAGE_SIZE + '&offset=' + offset);
    renderStatus(status); renderHistory(history, status);
  } catch (_) {
    byId('connection').textContent = '通信断'; byId('connection').classList.add('error');
    byId('temperature-age').textContent = '通信断のため現在の鮮度は未確認';
    byId('humidity-age').textContent = '通信断のため現在の鮮度は未確認';
  } finally { busy = false; timer = setTimeout(refresh, 5000); }
}
byId('older').addEventListener('click', () => { if (!busy) { offset += PAGE_SIZE; refresh(); } });
byId('newer').addEventListener('click', () => { if (!busy) { offset = Math.max(0, offset - PAGE_SIZE); refresh(); } });
window.addEventListener('resize', drawCharts);
refresh();
</script>
</body>
</html>
